# Deploy static content to GitHub Pages (talentbridge.qd.je)
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build static site
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          python tools/build_static.py
          test -f site/index.html
          test -f site/CNAME
          test -f site/.nojekyll
          grep -q 'name="talentbridge-django-origin-local"' site/index.html
          grep -q 'js/core/host-runtime.js' site/pages/login.html
          grep -q 'js/core/google-pages-signin.js' site/pages/login.html
          if [ -n "${GOOGLE_OAUTH_CLIENT_ID:-}" ]; then
            grep -q 'name="google-oauth-client-id"' site/pages/login.html
            echo "Google client ID embedded for Pages"
          else
            echo "WARN: Set repository variable GOOGLE_OAUTH_CLIENT_ID for live Google sign-in"
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4