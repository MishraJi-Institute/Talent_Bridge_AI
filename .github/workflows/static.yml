# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build static site
        env:
          TALENTBRIDGE_DJANGO_ORIGIN: ${{ vars.TALENTBRIDGE_DJANGO_ORIGIN }}
        run: |
          python tools/build_static.py
          test -f site/index.html
          test -f site/CNAME
          test -f site/.nojekyll
          grep -q 'name="talentbridge-django-origin"' site/index.html
          grep -q 'name="talentbridge-django-origin"' site/pages/jobseeker-signup.html
          grep -q 'js/core/demo-forms.js' site/pages/jobseeker-signup.html
          echo "Static build OK (Django OAuth handoff verified)"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: 'site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
