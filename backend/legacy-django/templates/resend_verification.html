{% load static %}
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resend verification | TalentBridge AI</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f7fc;font-family:Arial,sans-serif;color:#172554}
.card{width:min(100%,440px);background:white;border:1px solid #e2e8f0;border-radius:20px;padding:32px;box-shadow:0 20px 60px #18345c18}
h1{margin:0 0 10px;font-size:26px}p{color:#64748b;line-height:1.6}label{display:block;margin:20px 0 8px;font-weight:700}
input{width:100%;height:48px;border:1px solid #cbd5e1;border-radius:10px;padding:0 12px;font-size:15px}
button{width:100%;height:48px;margin-top:18px;border:0;border-radius:10px;background:#2563eb;color:white;font-weight:700;cursor:pointer}
a{color:#2563eb;text-decoration:none}
</style></head>
<body><main class="card">
<h1>Verify your email</h1>
<p>Enter the email address you used to register. If it needs verification, we will send a fresh secure link.</p>
<form method="post">{% csrf_token %}
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required>
<button type="submit">Send verification link</button>
</form>
<p><a href="{% url 'login' %}">Back to sign in</a></p>
</main></body></html>
