<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backup redesign · Sign in | TalentBridge AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/unslop/unslop.css">
</head>
<body>
  <div class="banner">
    <div><strong>Backup redesign · sign in</strong><span class="quiet"> · Live site unchanged</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="/pages/unslop/index.html">Backup hub</a>
      <a href="/login/">Open live login</a>
    </div>
  </div>
  <main class="auth-shell">
    <div class="auth-card enter" style="--i:1">
      <a class="brand" href="/pages/unslop/homepage.html" style="justify-content:center;margin-bottom:20px">
        <img src="/images/talentbridge-mark.svg" alt="">TalentBridge<span>AI</span>
      </a>
      <h1>Welcome back</h1>
      <p class="sub">Sign in with your email and password.</p>
      <a class="btn btn-secondary" href="/auth/social/google/?role=choose" style="width:100%">Continue with Google</a>
      <div class="divider">OR EMAIL</div>
      <form method="post" action="/login/">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" required>
        <div style="text-align:right;margin-top:8px;font-size:12px"><a href="/forgot-password/" style="color:var(--accent);font-weight:500">Forgot password?</a></div>
        <button class="btn btn-primary" type="submit">Sign in with email</button>
      </form>
      <p class="footer-note">New to TalentBridge AI? <a href="/signup/">Create an account</a></p>
    </div>
  </main>
  <script src="/js/unslop/unslop.js"></script>
</body>
</html>
