<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentBridge AI</title>
  <script>
    (function () {
      var host = (location.hostname || "").toLowerCase();
      var isLocalFile = location.protocol === "file:";
      var isLocalHost = host === "127.0.0.1" || host === "localhost";

      // GitHub Pages / custom domain should be served from the Actions-built site/.
      // If this stub is ever served from the repository root, send visitors to the live domain.
      if (!isLocalFile && !isLocalHost) {
        window.location.replace("https://talentbridge.qd.je/");
        return;
      }

      var candidates = [
        "http://127.0.0.1:8000/",
        "http://127.0.0.1:8001/"
      ];
      var i = 0;
      function tryNext() {
        if (i >= candidates.length) {
          document.getElementById("msg").innerHTML =
            "Django is not running. Start it with <code>scripts/startup/START_TALENTBRIDGEAI.bat</code>, or build a static preview with <code>python tools/build_static.py</code> and open <a href=\"./site/index.html\">site/index.html</a>.";
          return;
        }
        var url = candidates[i++];
        fetch(url, { mode: "no-cors", cache: "no-store" })
          .then(function () { window.location.replace(url); })
          .catch(function () { setTimeout(tryNext, 120); });
      }
      window.location.replace(candidates[0]);
      setTimeout(tryNext, 900);
    })();
  </script>
  <meta http-equiv="refresh" content="4; url=https://talentbridge.qd.je/">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #102a56; line-height: 1.5; }
    a { color: #155eef; }
    code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>TalentBridge AI</h1>
  <p id="msg">Opening TalentBridge AI…</p>
  <p>
    Local Django: <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>
    · Live site: <a href="https://talentbridge.qd.je/">talentbridge.qd.je</a>
  </p>
</body>
</html>
