<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentBridge AI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #102a56; line-height: 1.5; }
    a { color: #155eef; }
    code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>TalentBridge AI</h1>
  <p id="msg">Opening local TalentBridge AI…</p>
  <p>
    Local Django:
    <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>
    ·
    <a href="http://127.0.0.1:8001/">http://127.0.0.1:8001/</a>
  </p>
  <p>Live site (only if local server is off): <a href="https://talentbridge.qd.je/">talentbridge.qd.je</a></p>
  <script>
    (function () {
      var host = (location.hostname || "").toLowerCase();
      var isLocalFile = location.protocol === "file:";
      var isLocalHost = host === "127.0.0.1" || host === "localhost";
      var msg = document.getElementById("msg");

      // GitHub Pages / custom domain: never trap on this stub.
      if (!isLocalFile && !isLocalHost) {
        window.location.replace("https://talentbridge.qd.je/");
        return;
      }

      // Local: keep retrying both managed ports so brief Django autoreload
      // gaps never strand the browser on an error page or the live domain.
      var candidates = [
        "http://127.0.0.1:8000/",
        "http://127.0.0.1:8001/"
      ];
      var attempt = 0;
      var maxAttempts = 120; // ~60s of retries

      function setMsg(text) {
        if (msg) msg.textContent = text;
      }

      function probe(url) {
        // file:// cannot read CORS responses; no-cors still fails hard if the port is down.
        if (isLocalFile) {
          return fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" })
            .then(function () { return url; });
        }
        return fetch(url, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          credentials: "omit"
        }).then(function (res) {
          return res.ok ? url : Promise.reject(new Error("bad status"));
        });
      }

      function tryNext() {
        attempt += 1;
        var url = candidates[(attempt - 1) % candidates.length];
        setMsg("Connecting to local TalentBridge… (" + url + ")");
        probe(url)
          .then(function (live) {
            window.location.replace(live);
          })
          .catch(function () {
            if (attempt >= maxAttempts) {
              setMsg(
                "Django is not responding on :8000 or :8001. Start it with scripts/startup/START_TALENTBRIDGEAI.bat, then refresh this page."
              );
              return;
            }
            setTimeout(tryNext, 500);
          });
      }

      tryNext();
    })();
  </script>
</body>
</html>
