<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TalentBridge AI</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; color: #102a56; line-height: 1.5; }
    a { color: #155eef; }
    code { background: #f1f5f9; padding: 0.1em 0.35em; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>TalentBridge AI</h1>
  <p id="msg">Opening TalentBridge AI…</p>
  <p>
    <strong>Local (this folder):</strong>
    <a href="http://127.0.0.1:8000/">http://127.0.0.1:8000/</a>
  </p>
  <p>
    <strong>GitHub live (no local server):</strong>
    <a href="https://talentbridge.qd.je/">https://talentbridge.qd.je/</a>
  </p>
  <script>
    (function () {
      var host = (location.hostname || "").toLowerCase();
      var isLocalFile = location.protocol === "file:";
      var isLocalHost = host === "127.0.0.1" || host === "localhost";
      var msg = document.getElementById("msg");

      // Already on GitHub Pages / custom domain → stay on live static site.
      if (!isLocalFile && !isLocalHost) {
        window.location.replace("https://talentbridge.qd.je/");
        return;
      }

      // Opening from this folder: prefer local Django, else fall back to live GitHub site.
      var candidates = [
        "http://127.0.0.1:8000/",
        "http://127.0.0.1:8001/",
        "https://talentbridge.qd.je/"
      ];
      var attempt = 0;
      var maxAttempts = 40;

      function setMsg(text) {
        if (msg) msg.textContent = text;
      }

      function probe(url) {
        if (url.indexOf("https://talentbridge.qd.je") === 0) {
          return Promise.resolve(url);
        }
        if (isLocalFile) {
          return fetch(url, { method: "GET", mode: "no-cors", cache: "no-store" })
            .then(function () { return url; });
        }
        return fetch(url, {
          method: "GET",
          mode: "cors",
          cache: "no-store",
          credentials: "omit"
        }).then(function (res) {
          return res.ok ? url : Promise.reject(new Error("bad status"));
        });
      }

      function tryNext() {
        attempt += 1;
        var url = candidates[Math.min(attempt - 1, candidates.length - 1)];
        if (attempt > 20) url = "https://talentbridge.qd.je/";
        setMsg("Connecting… (" + url + ")");
        probe(url)
          .then(function (live) {
            window.location.replace(live);
          })
          .catch(function () {
            if (attempt >= maxAttempts) {
              window.location.replace("https://talentbridge.qd.je/");
              return;
            }
            setTimeout(tryNext, 400);
          });
      }

      tryNext();
    })();
  </script>
</body>
</html>
