# Real Google OAuth needs this Django web service (GitHub Pages cannot finish OAuth).
# Render → New → Blueprint → select MishraJi-Institute/Talent_Bridge_AI
services:
  - type: web
    name: talentbridge-ai
    runtime: python
    plan: free
    # Full repo so frontend/ + database/ resolve next to backend/legacy-django
    rootDir: .
    buildCommand: |
      pip install -r backend/legacy-django/requirements.txt
      cd backend/legacy-django
      python manage.py migrate --noinput
      python manage.py prepare_deploy_auth
      python manage.py collectstatic --noinput
    startCommand: cd backend/legacy-django && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Set these in the Render dashboard (do not commit secrets):
      # DJANGO_ALLOWED_HOSTS=talentbridge-ai.onrender.com,talentbridge.qd.je
      # DJANGO_CSRF_TRUSTED_ORIGINS=https://talentbridge-ai.onrender.com,https://talentbridge.qd.je
      # GOOGLE_OAUTH_CLIENT_ID=...
      # GOOGLE_OAUTH_CLIENT_SECRET=...
      # GOOGLE_OAUTH_REDIRECT_ORIGIN=https://talentbridge-ai.onrender.com
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_ORIGIN
        sync: false
