# Auto-configured Django deploy for real Google OAuth.
# After Blueprint connect: set ONLY the two Google secrets in Render (or via sync script).
# Hosts, CSRF, redirect origin, Site.domain auto-fill from Render + talentbridge.qd.je.
services:
  - type: web
    name: talentbridge-ai
    runtime: python
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r backend/legacy-django/requirements.txt
      chmod +x backend/legacy-django/scripts/render_start.sh
      cd backend/legacy-django
      python manage.py collectstatic --noinput
    startCommand: bash backend/legacy-django/scripts/render_start.sh
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # Only secrets need a human/API once — everything else auto-detects on Render:
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
