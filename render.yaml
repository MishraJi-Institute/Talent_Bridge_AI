# Live app = same Django as local, with a cloud Postgres DB (not your PC's SQLite file).
# DNS: point app.talentbridge.qd.je CNAME → Render service (talentbridge-ai.onrender.com).
# Marketing site can stay on GitHub Pages at talentbridge.qd.je (static + link to app).
services:
  - type: web
    name: talentbridge-ai
    runtime: python
    plan: free
    repo: https://github.com/MishraJi-Institute/Talent_Bridge_AI
    branch: main
    rootDir: .
    buildCommand: bash backend/legacy-django/scripts/render_build.sh
    startCommand: bash backend/legacy-django/scripts/render_start.sh
    healthCheckPath: /__deploy__/health/
    autoDeploy: true
    domains:
      - app.talentbridge.qd.je
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_BEHIND_PROXY
        value: "true"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talentbridge-db
          property: connectionString
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false

databases:
  - name: talentbridge-db
    plan: free
    databaseName: talentbridge
    user: talentbridge